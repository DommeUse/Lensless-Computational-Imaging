defaults:
  - model: admm_unrolled
  - dataloader: main
  - writer: cometml
  - metrics: lensless
  - datasets: mirflickr
  - transforms: lensless
  - _self_

optimizer:
  _target_: torch.optim.Adam
  lr: 1e-4
  betas: [0.9, 0.999] # по крайней мере такие значения в статье от Bezzam

lr_scheduler:
  TODO

loss_function:
  _target_: src.loss.LenslessLoss
  
trainer:
  log_step: 50
  n_epochs: 25 # тоже из статьи Bezzam
  epoch_len: null
  resume_from: null # null or path to the checkpoint dir with *.pth and config.yaml
  device: auto # device name or "auto"
  device_tensors: ["lensless", "psf", "lensed"]
  from_pretrained: null
  override: True # if True, will override the previous run with the same name
  monitor: "max test_PSNR" # "off" or "max/min metric_name", i.e. our goal is to maximize/minimize metric
  save_period: 5 # checkpoint each save_period epochs in addition to the best epoch
  early_stop: ${trainer.n_epochs} # epochs for early stopping
  save_dir: "saved"
  seed: 1
  max_grad_norm: null